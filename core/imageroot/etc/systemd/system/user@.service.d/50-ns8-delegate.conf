#
# Delegate the io controller to module user managers so that rootless
# containers expose io.stat, like rootfull ones under machine.slice do.
# The default delegation is "memory pids" only. Delegating cpu as well is a
# prerequisite for any future per-module CPU limit.
#
[Service]
Delegate=cpu cpuset io memory pids
