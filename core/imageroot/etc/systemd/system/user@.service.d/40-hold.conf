#
# Keep the user manager stopped while the directory exists. It is the
# RuntimeDirectory of a unit that holds the user session, for example
# volumectl-rundir-MODULE_ID.service during volumectl move-volume.
# Otherwise a PAM session of the user, like the one opened by runagent
# for a backup, starts it again. The directory is removed when that
# unit stops, and never survives a reboot.
#
[Unit]
ConditionPathExists=!/run/nethserver/user-hold/%i
