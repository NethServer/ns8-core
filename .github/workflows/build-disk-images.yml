name: Build NS8 disk images
run-name: "Build NS8 disk images on ${{ github.event.workflow_run.head_branch || github.head_ref || github.ref_name }}"
on:
  workflow_run:
    workflows: [core]
    types:
      - completed
  workflow_dispatch:
    inputs:
      images_ref:
        description: "Branch, tag or commit of NethServer/ns8-images to build"
        type: string
        default: main
      dry_run:
        description: "Build the images without uploading them"
        type: boolean
        default: true

jobs:
  core-version:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
    steps:
      - id: python-dep
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - id: check
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pip install semver
          check_core_version=$(cat <<'EOF'
          import os, semver
          try:
            print("false") if semver.VersionInfo.parse(os.environ["HEAD_BRANCH"]).prerelease else print ("true")
          except ValueError: print("false")
          EOF
          )
          echo is_stable=$(python3 -c "$check_core_version") >> $GITHUB_OUTPUT
  build-images-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        source:
          - qemu.rl
    needs:
      - core-version
    if: github.event_name == 'workflow_dispatch' || needs.core-version.outputs.is_stable == 'true'
    steps:
      - name: Check runner capacity and KVM
        run: |
          set -euo pipefail
          nproc; free -h; df -h /
          # Without /dev/kvm the build would need TCG emulation, which is too
          # slow to complete within the job timeout.
          test -e /dev/kvm || { echo "::error::/dev/kvm is missing"; exit 1; }
          sudo chmod 0666 /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup s3cmd
        if: ${{ !inputs.dry_run }}
        run: |
          pip install s3cmd
          s3cmd --version
      - name: Setup `packer`
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: "1.16.1"
      - uses: actions/checkout@v6
        with:
          repository: NethServer/ns8-images
          ref: ${{ inputs.images_ref || 'main' }}
      - name: Run `packer init`
        id: init
        run: packer init .
      - name: Run `packer build`
        id: validate
        run: packer build --only=${{ matrix.source }} .
      - id: qcow2
        run: |
          IMAGE_PATH=$(cat packer-manifest.json | jq -r .builds[0].files[0].name)
          echo "path=${IMAGE_PATH}" >> "$GITHUB_OUTPUT"
      - id: vmdk
        name: Convert to VMDK
        run: |
          VMDK_PATH=$(echo ${{ steps.qcow2.outputs.path }} | sed -e 's/\.qcow2$/\.vmdk/')
          qemu-img convert -f qcow2 -O vmdk ${{ steps.qcow2.outputs.path }} $VMDK_PATH
          echo "path=${VMDK_PATH}" >> "$GITHUB_OUTPUT"
      - id: checksum
        name: Create checksum
        run: |
          cd $(dirname ${{ steps.qcow2.outputs.path }})
          sha256sum $(basename ${{ steps.qcow2.outputs.path }}) > ../CHECKSUM
          sha256sum $(basename ${{ steps.vmdk.outputs.path }}) >> ../CHECKSUM
          cat ../CHECKSUM
      - name: Upload images
        if: ${{ !inputs.dry_run }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACE_SECRET_KEY }}
        run: >
          s3cmd put
          --host=ams3.digitaloceanspaces.com
          --host-bucket=ns8.ams3.digitaloceanspaces.com
          --verbose
          --progress
          --acl-public
          --guess-mime-type
          ${{ steps.qcow2.outputs.path }}
          ${{ steps.vmdk.outputs.path }}
          CHECKSUM
          s3://ns8/ns8-images/
